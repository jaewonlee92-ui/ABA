<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172b4d"><title>Is it time yet?</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18253c;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:620px;margin:auto;padding:22px 16px 45px}header{text-align:center;margin-bottom:18px}h1{font-size:1.5rem;margin:0 0 6px}p{margin:7px 0}.muted{color:#526078}.panel{background:white;border:1px solid #dce2e9;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 3px 12px #12213c0b}.display{border-radius:22px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:9px}.display.green{background:#dcfce7;color:#14532d}.display.yellow{background:#fef3c7;color:#78350f}.display.red{background:#fee2e2;color:#7f1d1d}.symbol{font-size:4rem;line-height:1}.status{font-size:clamp(1.5rem,6vw,2.3rem);font-weight:850;letter-spacing:.02em}.message{font-size:1.1rem}.next{font-size:1.35rem;font-weight:750}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{border:0;border-radius:12px;padding:14px 7px;font-size:1rem;font-weight:750;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:3px}.greenbtn{background:#15803d;color:white}.yellowbtn{background:#eab308;color:#342500}.redbtn{background:#b91c1c;color:white}button[aria-pressed=true]{outline:4px solid #172b4d;outline-offset:2px}label{display:block;font-weight:650;margin-bottom:7px}input{font:inherit;border:1px solid #9ca8b8;border-radius:10px;padding:12px;width:100%;background:white}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.note{font-size:.86rem;color:#526078;line-height:1.5}.hide{display:none}.smallbtn{background:#e8edf4;color:#18253c;width:100%;margin-top:10px}@media(max-width:440px){.fields{grid-template-columns:1fr}.controls button{font-size:.9rem}}@media print{.panel.controls-panel,.note,header .muted{display:none}.wrap{max-width:100%}}
</style></head><body><main class="wrap"><header><h1>It's available</h1><p class="muted">Check the current status and next available time</p></header><section id="display" class="display yellow" aria-live="polite"><div id="symbol" class="symbol">◷</div><div id="status" class="status">PLEASE WAIT</div><div id="message" class="message">Come back later</div><div id="next" class="next"></div></section><section class="panel controls-panel"><h2 style="font-size:1.1rem;margin-top:0">Caregiver controls</h2><div class="controls"><button class="greenbtn" data-status="green">✓ Green</button><button class="yellowbtn" data-status="yellow">◷ Yellow</button><button class="redbtn" data-status="red">✕ Red</button></div><div class="fields"><div><label for="time">Next available time</label><input id="time" type="time" value="17:00"></div><div><label for="detail">Optional short message</label><input id="detail" maxlength="90" placeholder="e.g. After dinner"></div></div><button id="toggle" class="smallbtn">Hide caregiver controls</button></section><button id="show" class="smallbtn hide">Show caregiver controls</button><p class="note">Green means available now; yellow means a short/known delay; red means the unavailable.</p></main><script>
const key='availability-board-v1';let state={status:'yellow',time:'17:00',detail:''};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&['green','yellow','red'].includes(saved.status))state={...state,...saved}}catch(e){}const $=id=>document.getElementById(id);$('time').value=state.time;$('detail').value=state.detail;function pretty(t){if(!/^\d\d:\d\d$/.test(t))return '';const [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}function render(){const s=state.status;const config={green:['✓','AVAILABLE NOW','You can ask to use the internet.'],yellow:['◷','PLEASE WAIT','Internet access is available later.'],red:['✕','NOT AVAILABLE','Internet access is unavailable right now.']}[s];$('display').className='display '+s;$('symbol').textContent=config[0];$('status').textContent=config[1];$('message').textContent=state.detail||config[2];$('next').textContent=s==='yellow'&&state.time?'Next available: '+pretty(state.time):'';document.querySelectorAll('[data-status]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===s)));try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{state.status=b.dataset.status;render()}));$('time').addEventListener('input',e=>{state.time=e.target.value;render()});$('detail').addEventListener('input',e=>{state.detail=e.target.value;render()});$('toggle').addEventListener('click',()=>{document.querySelector('.controls-panel').classList.add('hide');$('show').classList.remove('hide')});$('show').addEventListener('click',()=>{document.querySelector('.controls-panel').classList.remove('hide');$('show').classList.add('hide')});render();
</script></body></html>
